<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 3: ระบบหน่วงเวลาและนับจำนวน</title>
    <style>
        :root { --bg: #1e293b; --text: #f8fafc; --accent: #3b82f6; --led-on: #10b981; --ladder-bg: #0f172a;}
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0;}
        h1 { text-align: center; color: #93c5fd; border-bottom: 1px solid #334155; padding-bottom: 15px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .module { background: var(--ladder-bg); padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        
        .process-view { background: #000; padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;}
        .segment { font-family: 'Courier New', monospace; font-size: 2em; color: #fbbf24; }
        .led { width: 24px; height: 24px; border-radius: 50%; background: #334155; border: 2px solid #64748b; }
        .led.on { background: var(--led-on); border-color: #fff; box-shadow: 0 0 15px var(--led-on); }
        
        .ladder { background: #f8fafc; color: #333; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 1em; border-left: 4px solid #ef4444; border-right: 4px solid #ef4444;}
        .l-rung { display: flex; align-items: center; height: 40px; position: relative; }
        .l-line { position: absolute; left: 0; right: 0; height: 2px; background: #cbd5e1; z-index: 1;}
        .l-item { position: relative; z-index: 2; background: #f8fafc; padding: 0 5px; margin: 0 10px; font-weight: bold;}
        .l-coil { margin-left: auto; z-index: 2; background: white; padding: 2px 5px; border:1px solid #333;}
        
        .active-rung .l-line { background: var(--led-on); box-shadow: 0 0 5px var(--led-on); }
        .active-text { color: var(--led-on); }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { background: var(--accent); border: none; color: white; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1;}
        button:active { background: #2563eb; }
        .input-set { width: 60px; padding: 5px; background: #334155; color: white; border: 1px solid #64748b; border-radius: 4px; text-align: center; font-weight: bold;}
    </style>
</head>
<body>
    <h1>บทที่ 3: ระบบหน่วงเวลาและนับจำนวนเชิงลึก (10 กรณีศึกษา)</h1>
    <div class="grid" id="dash"></div>

    <script>
        const configs = [
            { id: 0, type: 'timer', title: "1. On-Delay Timer (หน่วงเวลาเปิด)", inst: "T0", in: "X0", set: 30, cur: 0, act: false, done: false },
            { id: 1, type: 'timer', title: "2. Off-Delay Logic (หน่วงเวลาปิด)", inst: "T1", in: "X1", set: 50, cur: 0, act: false, done: false, spec: 'off-delay' },
            { id: 2, type: 'timer', title: "3. Retentive Timer (สะสมเวลา ST)", inst: "ST0", in: "X2", set: 100, cur: 0, act: false, done: false, retentive: true },
            { id: 3, type: 'timer', title: "4. Flasher (วงจรกะพริบ)", inst: "T2/T3", in: "X3", set: 10, cur: 0, act: false, done: false, spec: 'flasher' },
            { id: 4, type: 'counter', title: "5. Up Counter (CTU)", inst: "C0", in: "X4", set: 5, cur: 0, done: false },
            { id: 5, type: 'counter', title: "6. Down Counter (CTD)", inst: "C1", in: "X5", set: 10, cur: 10, done: false, spec: 'down' },
            { id: 6, type: 'counter', title: "7. Up/Down Counter", inst: "C235", in: "X6(U)/X7(D)", set: 15, cur: 0, done: false, spec: 'ud' },
            { id: 7, type: 'complex', title: "8. Timer Cascade (ไฟจราจร)", inst: "T4->T5", in: "X10", set: 20, cur: 0, act: false, done: false },
            { id: 8, type: 'complex', title: "9. Counter triggers Timer", inst: "C3+T6", in: "X11", set: 3, cur: 0, done: false },
            { id: 9, type: 'complex', title: "10. Batch Process Limit", inst: "C4", in: "X12", set: 20, cur: 0, done: false }
        ];

        function render() {
            const dash = document.getElementById('dash');
            dash.innerHTML = '';
            configs.forEach((cfg, i) => {
                const isT = cfg.type === 'timer' || cfg.type === 'complex';
                const outState = cfg.spec === 'off-delay' ? (cfg.act || !cfg.done) : cfg.done; // Logic for off-delay
                
                dash.innerHTML += `
                    <div class="module">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <h3 style="margin:0; color:#cbd5e1; font-size:1.1em;">${cfg.title}</h3>
                            <div>Set: K <input type="number" class="input-set" value="${cfg.set}" onchange="updateSet(${i}, this.value)"></div>
                        </div>
                        
                        <div class="process-view">
                            <div class="segment">${cfg.cur.toString().padStart(4, '0')}</div>
                            <div style="text-align:center;">
                                <div style="color:#94a3b8; font-size:0.8em; margin-bottom:5px;">Output</div>
                                <div class="led ${outState ? 'on' : ''}"></div>
                            </div>
                        </div>

                        <div class="ladder">
                            <div class="l-rung ${cfg.act ? 'active-rung' : ''}">
                                <div class="l-line"></div>
                                <div class="l-item ${cfg.act ? 'active-text' : ''}">| | ${cfg.in}</div>
                                <div class="l-coil ${cfg.act ? 'active-text' : ''}">[${isT?'OUT':'CNT'} ${cfg.inst} K${cfg.set}]</div>
                            </div>
                            <div class="l-rung ${outState ? 'active-rung' : ''}">
                                <div class="l-line"></div>
                                <div class="l-item ${outState ? 'active-text' : ''}">| | ${cfg.inst.split('/')[0]}</div>
                                <div class="l-coil ${outState ? 'active-text' : ''}">( Y${i} )</div>
                            </div>
                        </div>

                        <div class="btn-group">
                            ${isT 
                                ? `<button onmousedown="startT(${i})" onmouseup="stopT(${i})" onmouseleave="stopT(${i})">Hold Input</button>`
                                : `<button onclick="pulseC(${i}, 1)">Pulse UP</button>
                                   ${cfg.spec === 'ud' ? `<button onclick="pulseC(${i}, -1)">Pulse DN</button>` : ''}`}
                            <button style="background:#ef4444; flex:0.5;" onclick="reset(${i})">RST</button>
                        </div>
                    </div>
                `;
            });
        }

        function updateSet(i, val) { configs[i].set = parseInt(val) || 0; render(); }
        
        let timers = {};
        function startT(i) {
            if(timers[i]) return;
            configs[i].act = true;
            if(configs[i].spec === 'off-delay') configs[i].done = false; // Reset timer on input active
            
            timers[i] = setInterval(() => {
                if(configs[i].spec === 'flasher') {
                    configs[i].cur = (configs[i].cur + 1) % (configs[i].set * 2);
                    configs[i].done = configs[i].cur >= configs[i].set;
                } else {
                    if(configs[i].cur < configs[i].set) configs[i].cur++;
                    if(configs[i].cur >= configs[i].set) configs[i].done = true;
                }
                render();
            }, 100);
            render();
        }

        function stopT(i) {
            clearInterval(timers[i]); timers[i] = null;
            configs[i].act = false;
            if(!configs[i].retentive && configs[i].spec !== 'off-delay') {
                configs[i].cur = 0; configs[i].done = false;
            }
            if(configs[i].spec === 'off-delay') {
                // start counting off delay
                timers[i] = setInterval(() => {
                     if(configs[i].cur < configs[i].set) configs[i].cur++;
                     if(configs[i].cur >= configs[i].set) {
                         configs[i].done = true; // Timer done cuts off output in off-delay logic
                         clearInterval(timers[i]); timers[i] = null;
                     }
                     render();
                }, 100);
            }
            render();
        }

        function pulseC(i, dir) {
            configs[i].act = true;
            setTimeout(() => { configs[i].act = false; render(); }, 150);
            
            if(configs[i].spec === 'down') {
                if(configs[i].cur > 0) configs[i].cur--;
                configs[i].done = configs[i].cur === 0;
            } else {
                configs[i].cur += dir;
                configs[i].done = configs[i].cur >= configs[i].set;
            }
            render();
        }

        function reset(i) {
            configs[i].cur = configs[i].spec === 'down' ? configs[i].set : 0;
            configs[i].done = false;
            render();
        }
        
        render();
    </script>
</body>
</html>
